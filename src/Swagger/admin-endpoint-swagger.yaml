  - name: FAQ Management
    description: Operations related to frequently asked questions
  - name: Announcement Management
    description: Operations related to system announcements
  - name: Staff Management
    description: Operations related to staff schedules
  - name: Notification Management
    description: Operations related to system notifications
  - name: System Settings
    description: Operations related to system configuration
  - name: Analytics
    description: Operations related to system analytics and reporting
  - name: Reports
    description: Operations related to report generation