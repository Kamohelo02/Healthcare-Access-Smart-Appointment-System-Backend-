  # Reports Endpoint
  /admin/reports/generate:
    get:
      summary: Generate report
      description: Generate various system reports (users, appointments, etc.)
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [users, appointments, feedback, financial]
            example: "users"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, pdf]
            default: "json"
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Report generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  report:
                    type: object
                    additionalProperties: true
                  download_url:
                    type: string
                    example: "/reports/report-12345.pdf"
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid report type or parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# Common Responses
components:
  responses:
    Unauthorized:
      description: Authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              success: false
              message: "Authentication required"
              error: "Token not provided"
    
    Forbidden:
      description: User does not have required permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              success: false
              message: "Insufficient permissions"
              error: "Admin role required"
    
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              success: false
              message: "Server error processing request"
              error: "Database connection failed"

